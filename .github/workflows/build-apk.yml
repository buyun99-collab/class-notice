name: 칠판 앱 APK 만들기

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 준비
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK 내려받기 파일로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: class-notice-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 릴리스에 APK 올리기 (로그인 없이 내려받기 가능)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk class-notice.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest class-notice.apk --title "교실 공지 알림 최신 APK" --notes "자동 빌드 ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
