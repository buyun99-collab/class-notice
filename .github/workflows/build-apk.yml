name: 칠판 앱 APK 만들기

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK 내려받기 파일로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: class-notice-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 릴리스에 APK 올리기 (로그인 없이 내려받기 가능)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk class-notice.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest class-notice.apk --title "교실 공지 알림 최신 APK" --notes "자동 빌드 ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
